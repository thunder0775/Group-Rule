name: Monitor Upstream Rules

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes, offset from the hour to reduce scheduled-run congestion.
    - cron: "7,22,37,52 * * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: read
  actions: write

concurrency:
  group: upstream-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check upstream content
        id: check
        continue-on-error: true
        run: python scripts/upstream_monitor.py

      - name: Trigger rebuild
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run update-rules.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f reason="upstream-content-change"
          echo "Rule rebuild requested."
