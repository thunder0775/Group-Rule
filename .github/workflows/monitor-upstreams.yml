name: Monitor Upstream Rules

on:
  workflow_dispatch:
  push:
    branches:
      - test/upstream-sync-fix
  schedule:
    - cron: "7,22,37,52 * * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: write

concurrency:
  group: upstream-monitor-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check upstream content
        id: check
        run: |
          set +e
          python scripts/upstream_monitor.py
          status=$?
          if [ "$status" -eq 2 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit "$status"

  rebuild:
    needs: monitor
    if: needs.monitor.outputs.changed == 'true'
    uses: ./.github/workflows/update-rules.yml
    with:
      reason: "upstream-content-change"
    permissions:
      contents: write
