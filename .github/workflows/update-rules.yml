name: Update Shadowrocket Rules

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    paths:
      - "config/**"
      - "scripts/**"
      - ".github/workflows/update-rules.yml"

permissions:
  contents: write

concurrency:
  group: shadowrocket-rules
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guard direct-rule upstreams
        run: python scripts/direct_source_guard.py

      - name: Build and audit
        run: python scripts/rule_engine.py

      - name: Sanitize China direct rules
        run: python scripts/direct_rule_sanitize.py

      - name: Regression test direct rules
        run: python scripts/direct_rule_regression.py

      - name: Show report
        if: always()
        run: cat reports/latest.md

      - name: Commit generated rules
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules reports
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: update generated shadowrocket rules"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
